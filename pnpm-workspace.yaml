packages:
  - apps/*
  - packages/*

# Pin exact versions on `pnpm add` (reproducible installs; Dependabot proposes bumps).
saveExact: true
engineStrict: true

# pnpm blocks dependency install scripts by default (supply-chain protection).
# Only packages listed `true` here may run them.
allowBuilds:
  esbuild: true # bundler binary for tsup/vite
  argon2: true # native password hashing
  msgpackr-extract: false # optional bullmq speedup; prebuilt binaries arrive via optional deps
  prisma: true # downloads the migration/schema engine
  '@prisma/engines': true
  '@scarf/scarf': false # install-time telemetry; not needed
  '@parcel/watcher': false # ships prebuilt binaries; script only builds a fallback
  unrs-resolver: false # ships prebuilt binaries via optional deps

# pnpm refuses packages published very recently (malicious releases are usually caught
# within days). These were explicitly reviewed and allowed.
minimumReleaseAgeExclude:
  - '@nestjs/common@11.2.7'
  - '@nestjs/core@11.2.7'
  - '@nestjs/platform-express@11.2.7'
  - '@nestjs/testing@11.2.7'

overrides:
  # Security patches for advisories in dev tooling (nest CLI, prisma CLI) — `pnpm audit`.
  'picomatch@>=4.0.0 <4.0.4': 4.0.7 # GHSA ReDoS
  'mysql2@<3.22.0': 3.24.5 # auth-plugin downgrade (unused: we run Postgres)
  'deepmerge-ts@<8.0.0': 8.0.2 # stack exhaustion on recursive objects
  'glob@>=11.0.0 <11.1.0': 11.1.0 # CLI command injection (patched in 11.1.0 line)
