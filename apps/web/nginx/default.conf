# Serves the SPA and reverse-proxies /api to the Nest container, so the browser sees a
# single origin: no CORS preflights, and the SameSite=strict refresh cookie just works.
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id; # correlates nginx and api log lines
        client_max_body_size 1m;
    }

    # Vite emits content-hashed filenames, so these can be cached forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA fallback: unknown paths return index.html and React Router takes over.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
